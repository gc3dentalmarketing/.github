name: 不具合の報告
description: 動かない・落ちる・結果がおかしい
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        不具合の報告ありがとうございます。再現できる情報があるほど早く直せるので、分かる範囲で記入してください。
        書き方に迷ったら [記入ガイド](https://github.com/gc3dentalmarketing/.github/blob/main/%E8%A8%98%E5%85%A5%E3%82%AC%E3%82%A4%E3%83%89.md) を見てください。
        **このリポジトリは公開されています。** 医院名・患者情報・ログイン情報は書かず、スクリーンショットにも写さないでください。

  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容の Issue がすでに無いか検索しました
          required: true
        - label: アプリの再起動・ページの再読み込みをしても直りませんでした
          required: false

  - type: dropdown
    id: severity
    attributes:
      label: 影響度
      description: 業務への影響がいちばん近いものを選んでください
      options:
        - 致命的（業務が止まる・データが消える）
        - 高（主要機能が使えないが回避策はある）
        - 中（一部機能がおかしい）
        - 低（見た目・誤字など軽微なもの）
      default: 2
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 発生頻度
      options:
        - 毎回起きる
        - ときどき起きる
        - 一度だけ起きた
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 何が起きたか
      description: 起きた不具合を簡潔に書いてください
      placeholder: 例）夜の学習が途中で止まり、報告ファイルが作られない
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 不具合が起きるまでの操作を順番に書いてください
      placeholder: |
        1. ○○画面を開く
        2. ○○をクリック
        3. エラーが表示される
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 本来どうなるべきか
      placeholder: 例）朝までに報告ファイルが作られている
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 使用環境（OS）
      multiple: true
      options:
        - Windows
        - macOS
        - iOS（iPhone / iPad）
        - Android
        - その他・不明
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: アプリ・ブラウザのバージョン
      description: 分かる場合のみ（例：JARVIS v1.2.3 / Chrome 130）
      placeholder: 例）v1.2.3

  - type: textarea
    id: logs
    attributes:
      label: エラーメッセージ・ログ
      description: 表示されたエラー文やログを貼り付けてください（自動でコード表示になります）。トークンやパスワードが含まれていたら消してから貼ってください
      render: shell

  - type: textarea
    id: attachments
    attributes:
      label: スクリーンショット・補足
      description: 画像はドラッグ＆ドロップで添付できます。医院名・患者情報・パスワードは写さないでください
