name: ✨ 機能要望
description: 新しい機能や改善のアイデアを提案します
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        アイデアの共有ありがとうございます。
        「なぜ必要か」が分かると優先順位を決めやすくなります。

  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容の Issue がすでに無いか検索しました
          required: true

  - type: dropdown
    id: category
    attributes:
      label: 要望の種類
      options:
        - 新機能の追加
        - 既存機能の改善
        - 画面・使い勝手（UI/UX）の改善
        - 自動化・効率化
        - その他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 希望する優先度
      options:
        - 高（業務上すぐに必要）
        - 中（あると助かる）
        - 低（いつか欲しい）
      default: 1
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 困っていること・背景
      description: どんな場面で何に困っているかを書いてください
      placeholder: 例）毎月のレポート作成で、同じ数値を手作業で転記していて時間がかかる
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する内容
      description: どうなっていると嬉しいかを書いてください
      placeholder: 例）ボタン一つで先月分の数値がレポートに反映されるようにしたい
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 今やっている回避策や、ほかに考えた方法があれば書いてください

  - type: checkboxes
    id: impact
    attributes:
      label: 影響する範囲（当てはまるものすべて）
      options:
        - label: チーム内の作業効率
        - label: 歯科医院（クライアント）向けの成果物・報告
        - label: 患者さん向けの発信・集患施策
        - label: データ・セキュリティまわり

  - type: textarea
    id: attachments
    attributes:
      label: 参考資料・補足
      description: 参考サイトの URL や画面イメージがあれば添付してください。患者情報・パスワード等の個人情報は含めないでください。
